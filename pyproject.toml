[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papermoon-mkdocs-mcp"
version = "0.2.0"
description = "A lightweight MCP server for MkDocs documentation sites"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
keywords = ["mkdocs", "mcp", "documentation", "search", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
]
dependencies = [
    "fastmcp>=3.0.0,<4",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0",
    "markdown>=3.4",
]

[project.optional-dependencies]
vector = [
    "sentence-transformers>=3.0",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
papermoon-mkdocs-mcp = "mkdocs_mcp.server:main"

[tool.hatch.build.targets.wheel]
# Must be the real on-disk path. A bare "mkdocs_mcp" resolves relative to the
# project root, where no such directory exists, and hatchling then builds a
# wheel containing only .dist-info metadata and no code at all. The previous
# [tool.hatch.build] sources = ["src"] did not rescue it: sources rewrites the
# paths of files already selected for inclusion, it does not tell the wheel
# target where to look.
packages = ["src/mkdocs_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults: the dev extra
# allows any ruff >=0.4, and the default rule set has widened between
# releases. Without this, a ruff upgrade could turn CI red without a code
# change. Broaden deliberately (e.g. add "I", "B", "UP") rather than by
# accident.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
